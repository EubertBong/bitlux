# Alembic configuration for the Bitlux CRM backend.
#
# The database URL is NOT stored here. env.py reads DATABASE_URL from the
# environment (optionally via backend/.env), so the same config works for local
# Docker, CI, and Neon without edits. See backend/.env.example.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migrations are hand-numbered 001..015 to match the order documented in
# DATA_MODEL.md. Keep the zero-padded numeric prefix for new revisions.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration headers use UTC.
timezone = UTC

# sqlalchemy.url is intentionally absent -- set DATABASE_URL instead.

[post_write_hooks]
# No formatting hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
